<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0a12">
<title>Tyler & Julie — Photo Booth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Creepster&family=Great+Vibes&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0a12; --ink:#f5ead7; --muted:#a99fb3; --orange:#ff8a3d; --purple:#6b3fa0; --line:rgba(255,255,255,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .screen{position:fixed;inset:0;display:none}
  .screen.on{display:block}

  /* ---------- Welcome ---------- */
  #welcome{display:none;background:radial-gradient(120% 70% at 50% 0%,#2a1640 0%,var(--bg) 60%);overflow-y:auto}
  #welcome.on{display:flex;align-items:center;justify-content:center}
  .welcome-inner{width:100%;max-width:400px;padding:32px 20px calc(32px + env(safe-area-inset-bottom));text-align:center}
  .bats{font-size:26px;letter-spacing:14px;opacity:.85;animation:float 4s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-6px)}}
  h1{font-family:"Great Vibes",cursive;font-weight:400;font-size:64px;line-height:1.1;margin:10px 0 6px}
  .sub{color:var(--orange);font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;line-height:1.7}
  .card{margin-top:34px;text-align:left}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:600}
  input[type=text]{width:100%;font-size:18px;padding:15px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);outline:none}
  input[type=text]:focus{border-color:var(--orange)}
  .primary{display:block;width:100%;margin-top:14px;padding:16px;border-radius:14px;background:var(--orange);color:#1a0f05;font-weight:700;font-size:18px}
  .primary:disabled{opacity:.45}
  .fine{margin-top:16px;font-size:13px;color:var(--muted);text-align:center;line-height:1.5}

  /* ---------- Camera / Review ---------- */
  #camera,#review{background:#000}
  .stage{position:absolute;left:50%;top:env(safe-area-inset-top);transform:translateX(-50%);
    width:min(100vw, calc((100vh - env(safe-area-inset-top)) * 9 / 16));
    width:min(100vw, calc((100dvh - env(safe-area-inset-top)) * 9 / 16));
    aspect-ratio:9/16;overflow:hidden;background:#111;touch-action:pan-y;user-select:none;-webkit-user-select:none}
  @media (min-aspect-ratio: 10/16){.stage{border-radius:18px}}
  .stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .stage video{object-fit:cover}
  .stage video.mirror{transform:scaleX(-1)}
  .pill{position:absolute;top:16px;left:50%;transform:translateX(-50%);padding:7px 14px;border-radius:99px;background:rgba(0,0,0,.55);font-size:14px;font-weight:600;white-space:nowrap;transition:opacity .3s;pointer-events:none}
  .pill.hide{opacity:0}
  .arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:56px;font-size:30px;line-height:56px;text-align:center;color:rgba(255,255,255,.75);text-shadow:0 1px 4px #000}
  .arrow.l{left:2px}.arrow.r{right:2px}
  .topbtn{position:absolute;top:12px;width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.45);font-size:20px;display:grid;place-items:center}
  .topbtn.l{left:12px}.topbtn.r{right:12px}
  .dots{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:6px;pointer-events:none}
  .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4)}
  .dots i.on{background:#fff;width:18px;border-radius:4px}
  .bar{position:absolute;left:0;right:0;bottom:0;padding:0 24px calc(22px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;max-width:480px;margin:0 auto}
  .shutter{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.25);transition:transform .1s}
  .shutter:active{transform:scale(.9)}
  .round{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;font-size:22px}
  .round small{display:block;font-size:10px;margin-top:2px}
  .spacer{width:52px}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
  .flash.go{opacity:1;transition:none}
  .hint{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);padding:10px 16px;border-radius:12px;background:rgba(0,0,0,.6);font-size:15px;font-weight:600;transition:opacity .5s;pointer-events:none;white-space:nowrap}
  .hint.hide{opacity:0}

  .review-bar{gap:12px}
  .send{flex:1;height:56px;border-radius:28px;background:var(--orange);color:#1a0f05;font-weight:700;font-size:17px}
  .send.done{background:#3ecf8e}
  .send:disabled{opacity:.6}
  .iconbtn{width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);display:grid;place-items:center}
  .iconbtn svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);max-width:90vw;padding:11px 16px;border-radius:12px;background:rgba(20,14,28,.95);border:1px solid var(--line);font-size:14px;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
</style>
</head>
<body>

<!-- 1. Name -->
<section id="welcome" class="screen on">
  <div class="welcome-inner">
    <div class="bats">🦇 🕸️ 🦇</div>
    <h1>Tyler &amp; Julie</h1>
    <div class="sub" id="dateLine">Till death do us part</div>
    <form class="card" id="nameForm" autocomplete="off">
      <label for="nameInput">Your name</label>
      <input id="nameInput" type="text" maxlength="60" placeholder="First &amp; last name" enterkeyhint="go" required>
      <button class="primary" id="startBtn" type="submit">Open camera 📸</button>
    </form>
    <p class="fine" id="modeNote">Every photo you keep gets sent straight to Tyler &amp; Julie.</p>
  </div>
</section>

<!-- 2. Camera -->
<section id="camera" class="screen">
  <div class="stage" id="camStage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay" width="1080" height="1920"></canvas>
    <div class="flash" id="flash"></div>
    <button class="arrow l" data-dir="-1" aria-label="Previous frame">‹</button>
    <button class="arrow r" data-dir="1" aria-label="Next frame">›</button>
    <div class="pill" id="camPill"></div>
    <div class="hint" id="hint">← Swipe for frames →</div>
    <button class="topbtn l" id="backBtn" aria-label="Back">✕</button>
  </div>
  <div class="dots" id="camDots"></div>
  <div class="bar">
    <span class="spacer"></span>
    <button class="shutter" id="shutter" aria-label="Take photo"></button>
    <button class="round" id="flipBtn" aria-label="Flip camera">🔄</button>
  </div>
  <input type="file" id="fileInput" accept="image/*" capture="user" hidden>
</section>

<!-- 3. Review -->
<section id="review" class="screen">
  <div class="stage" id="revStage">
    <canvas id="final" width="1080" height="1920"></canvas>
    <button class="arrow l" data-dir="-1" aria-label="Previous frame">‹</button>
    <button class="arrow r" data-dir="1" aria-label="Next frame">›</button>
    <div class="pill hide" id="revPill"></div>
  </div>
  <div class="dots" id="revDots"></div>
  <div class="bar review-bar">
    <button class="iconbtn" id="retakeBtn" aria-label="Delete and retake">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>
    </button>
    <button class="send" id="sendBtn">Send to Tyler &amp; Julie ♥</button>
    <button class="iconbtn" id="downloadBtn" aria-label="Download photo">
      <svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
    </button>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
(() => {
  const W = 1080, H = 1920;
  const UPLOAD_URL = '/api/upload';
  const $ = id => document.getElementById(id);
  const authToken = () => { try { return sessionStorage.getItem('archive_token') || ''; } catch { return ''; } };

  let config = null;
  let canSave = false;
  fetch('/api/config').then(r => r.json()).then(c => {
    config = c;
    const now = Date.now();
    canSave = !!c.configured && (now < c.end || !!authToken());
    if (c.start) {
      const d = new Date(c.start).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
      $('dateLine').innerHTML = 'Till death do us part<br>' + d;
    }
    if (!canSave) $('modeNote').textContent = 'The photo booth is closed, but you can still take and download photos.';
  }).catch(() => {});

  // ---------- helpers ----------
  const toastEl = $('toast'); let toastT;
  function toast(msg, ms = 2600) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), ms); }
  function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
  const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

  function emoji(ctx, ch, x, y, size, rot = 0) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot * Math.PI / 180);
    ctx.font = `${size}px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(ch, 0, 0); ctx.restore();
  }
  function text(ctx, str, y, { font, size, color = '#fff', shadow = true, maxW = 960 }) {
    ctx.save(); let s = size;
    ctx.font = `${s}px ${font}`;
    while (ctx.measureText(str).width > maxW && s > 20) { s -= 4; ctx.font = `${s}px ${font}`; }
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = color;
    if (shadow) { ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 3; }
    ctx.fillText(str, W / 2, y); ctx.restore();
  }
  function fadeBottom(ctx, h, a = .65) { const g = ctx.createLinearGradient(0, H - h, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`); ctx.fillStyle = g; ctx.fillRect(0, H - h, W, h); }
  function fadeTop(ctx, h, color = '0,0,0', a = .55) { const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, `rgba(${color},${a})`); g.addColorStop(1, `rgba(${color},0)`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, h); }
  function stampText(t) {
    const d = t.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    const tm = t.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    return `${d}  •  ${tm}`;
  }
  function stamp(ctx, t, color = '#fff', y = H - 70, shadow = true) {
    ctx.save(); ctx.font = `600 40px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif`;
    ctx.textAlign = 'center'; ctx.fillStyle = color;
    if ('letterSpacing' in ctx) ctx.letterSpacing = '3px';
    if (shadow) { ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 2; }
    ctx.fillText(stampText(t), W / 2, y); ctx.restore();
  }
  function web(ctx, cx, cy, r, a0, a1) {
    ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 3; ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 6;
    const spokes = 7, rings = 6, angs = [];
    for (let i = 0; i < spokes; i++) angs.push((a0 + (a1 - a0) * i / (spokes - 1)) * Math.PI / 180);
    angs.forEach(a => { ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); ctx.stroke(); });
    for (let k = 1; k <= rings; k++) {
      const rr = r * k / rings; ctx.beginPath();
      for (let i = 0; i < spokes; i++) {
        const x = cx + Math.cos(angs[i]) * rr, y = cy + Math.sin(angs[i]) * rr;
        if (i === 0) ctx.moveTo(x, y);
        else { const am = (angs[i] + angs[i - 1]) / 2, sag = rr * .86; ctx.quadraticCurveTo(cx + Math.cos(am) * sag, cy + Math.sin(am) * sag, x, y); }
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---------- frames (keys match the existing archive) ----------
  const SCRIPT = '"Great Vibes",cursive', SPOOK = 'Creepster,cursive', HAND = '"Caveat",cursive', GOTH = '"UnifrakturMaguntia",serif';
  const FRAMES = [
    { key: 'classic', name: '🤍 Just married', draw(c, t) {
      c.save(); c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 6; c.beginPath(); c.roundRect ? c.roundRect(40, 40, W - 80, H - 80, 30) : c.rect(40, 40, W - 80, H - 80); c.stroke(); c.restore();
      [[W - 95, 95, 15, 70], [W - 185, 150, -10, 44]].forEach(([x, y, r, s]) => emoji(c, '🤍', x, y, s, r));
      fadeBottom(c, 420, .6);
      text(c, 'Tyler & Julie', H - 170, { font: SCRIPT, size: 150 }); stamp(c, t);
    }},
    { key: 'ghosts', name: '👻 Boo-tiful', draw(c, t) {
      emoji(c, '👻', 150, 190, 170, -14); emoji(c, '👻', W - 120, 330, 110, 12); emoji(c, '👻', W - 230, 140, 70, -6);
      fadeBottom(c, 460, .65);
      emoji(c, '👻', 130, H - 330, 120, 10);
      text(c, 'Boo-tiful couple', H - 170, { font: HAND, size: 130 }); stamp(c, t);
    }},
    { key: 'bats', name: '🦇 Batty for you', draw(c, t) {
      fadeTop(c, 520, '40,10,60', .7);
      [[120,120,110,-20],[330,240,70,10],[520,110,90,-8],[720,260,60,15],[900,130,120,12],[980,380,55,-10],[220,420,50,18],[640,420,45,-14]].forEach(([x,y,s,r]) => emoji(c, '🦇', x, y, s, r));
      fadeBottom(c, 420, .7);
      text(c, 'Batty for these two', H - 170, { font: SPOOK, size: 110, color: '#ff8a3d' }); stamp(c, t);
    }},
    { key: 'tildeath', name: '💀 Till death', draw(c, t) {
      c.save(); c.fillStyle = '#0a0a0a';
      c.fillRect(0, 0, W, 50); c.fillRect(0, 0, 50, H); c.fillRect(W - 50, 0, 50, H); c.fillRect(0, H - 330, W, 330);
      c.strokeStyle = '#9b111e'; c.lineWidth = 4; c.strokeRect(64, 64, W - 128, H - 330 - 28); c.restore();
      emoji(c, '🥀', 120, H - 330, 90, -20); emoji(c, '🥀', W - 120, H - 330, 90, 20); emoji(c, '💀', W / 2, 64, 70);
      text(c, 'Till Death Do Us Part', H - 160, { font: GOTH, size: 100, color: '#f2e6d8', shadow: false });
      stamp(c, t, '#a89a8c', H - 70, false);
    }},
    { key: 'spooky', name: '🎃 Spooky cute', draw(c, t) {
      emoji(c, '🍂', 90, 100, 90, -25); emoji(c, '🍂', W - 90, 110, 80, 30); emoji(c, '🕸️', W - 110, 260, 100, 0);
      fadeBottom(c, 520, .7);
      [[90,H-330,110,-12],[W-95,H-340,120,10],[250,H-300,70,6],[W-260,H-305,65,-8]].forEach(([x,y,s,r]) => emoji(c, '🎃', x, y, s, r));
      text(c, 'Spooky & in love', H - 170, { font: SPOOK, size: 120, color: '#ff8a3d' }); stamp(c, t);
    }},
    { key: 'moon', name: '🌕 Blood moon', draw(c, t) {
      c.fillStyle = 'rgba(130,0,20,.22)'; c.fillRect(0, 0, W, H);
      c.save(); c.shadowColor = 'rgba(255,40,40,.9)'; c.shadowBlur = 80;
      const g = c.createRadialGradient(W - 230, 260, 20, W - 230, 260, 150); g.addColorStop(0, '#ff6b4a'); g.addColorStop(1, '#8e0f12');
      c.fillStyle = g; c.beginPath(); c.arc(W - 230, 260, 150, 0, Math.PI * 2); c.fill(); c.restore();
      emoji(c, '🦇', W - 330, 220, 70, -12); emoji(c, '🦇', W - 140, 330, 55, 14);
      fadeBottom(c, 420, .7);
      text(c, 'Once in a blood moon', H - 170, { font: SCRIPT, size: 130, color: '#ffd9d0' }); stamp(c, t);
    }},
    { key: 'web', name: '🕷️ Caught in love', draw(c, t) {
      web(c, 0, 0, 420, 0, 90); web(c, W, 0, 360, 90, 180);
      c.save(); c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 3; c.beginPath(); c.moveTo(W - 300, 0); c.lineTo(W - 300, 470); c.stroke(); c.restore();
      emoji(c, '🕷️', W - 300, 510, 90);
      fadeBottom(c, 420, .65);
      text(c, 'Caught in the love web', H - 170, { font: HAND, size: 120 }); stamp(c, t);
    }},
    { key: 'cake', name: '🎂 Here for cake', draw(c, t) {
      fadeBottom(c, 520, .7);
      [['🎂',110,H-330,110,-10],['🍬',260,H-300,70,15],['🍭',W-260,H-305,70,-12],['🍰',W-110,H-335,105,10]].forEach(([e,x,y,s,r]) => emoji(c, e, x, y, s, r));
      text(c, 'Just here for the cake', H - 170, { font: HAND, size: 125 }); stamp(c, t);
    }},
    { key: 'polaroid', name: '📷 Polaroid', draw(c, t) {
      c.save(); c.fillStyle = '#fbf8f2'; c.fillRect(0, 0, W, 56); c.fillRect(0, 0, 56, H); c.fillRect(W - 56, 0, 56, H); c.fillRect(0, H - 380, W, 380); c.restore();
      text(c, 'Tyler & Julie ♡', H - 200, { font: HAND, size: 130, color: '#2a2230', shadow: false });
      stamp(c, t, '#8a8190', H - 90, false);
    }},
    { key: 'none', name: 'No frame', draw(c, t) { fadeBottom(c, 200, .35); stamp(c, t); } },
  ];

  let frameIdx = 0;
  const fontsReady = Promise.all(['150px "Great Vibes"', '120px Creepster', '120px Caveat', '100px UnifrakturMaguntia'].map(f => document.fonts.load(f).catch(() => {}))).then(() => document.fonts.ready);

  function drawFrame(ctx, idx, time) { ctx.clearRect(0, 0, W, H); FRAMES[idx].draw(ctx, time); }

  function dots(el, idx) { el.innerHTML = FRAMES.map((_, i) => `<i class="${i === idx ? 'on' : ''}"></i>`).join(''); }
  let pillT;
  function flashPill(el, ms = 1400) { el.textContent = FRAMES[frameIdx].name; el.classList.remove('hide'); clearTimeout(pillT); pillT = setTimeout(() => el.classList.add('hide'), ms); }

  function setFrame(i) {
    frameIdx = (i + FRAMES.length) % FRAMES.length;
    if (current === 'camera') { drawFrame(octx, frameIdx, new Date()); dots($('camDots'), frameIdx); flashPill($('camPill')); }
    else if (current === 'review') { compose(); dots($('revDots'), frameIdx); flashPill($('revPill')); }
  }

  function swipe(el) {
    let sx = null, sy = 0;
    el.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
    el.addEventListener('touchend', e => {
      if (sx === null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { setFrame(frameIdx + (dx < 0 ? 1 : -1)); hideHint(); }
    });
    el.querySelectorAll('.arrow').forEach(b => b.addEventListener('click', () => { setFrame(frameIdx + Number(b.dataset.dir)); hideHint(); }));
  }
  swipe($('camStage')); swipe($('revStage'));
  document.addEventListener('keydown', e => { if (current === 'welcome') return; if (e.key === 'ArrowRight') setFrame(frameIdx + 1); if (e.key === 'ArrowLeft') setFrame(frameIdx - 1); });

  // position dots just above the bottom bar
  function placeDots() {
    const barTop = document.querySelector('#camera .bar').getBoundingClientRect().top || (innerHeight - 120);
    ['camDots', 'revDots'].forEach(id => $(id).style.top = (Math.max(0, barTop - 22)) + 'px');
  }
  addEventListener('resize', placeDots);

  // ---------- name screen ----------
  const nameInput = $('nameInput');
  try { nameInput.value = localStorage.getItem('booth_name') || ''; } catch {}
  let guestName = '';
  $('nameForm').addEventListener('submit', e => {
    e.preventDefault();
    guestName = nameInput.value.trim();
    if (!guestName) { nameInput.focus(); toast('Type your name first'); return; }
    try { localStorage.setItem('booth_name', guestName); } catch {}
    nameInput.blur();
    openCamera();
  });

  // ---------- camera ----------
  let current = 'welcome';
  const video = $('video'), overlay = $('overlay'), octx = overlay.getContext('2d');
  let stream = null, facing = 'user', clockT, hintShown = false;

  function hideHint() { $('hint').classList.add('hide'); }

  async function openCamera() {
    current = 'camera'; show('camera'); placeDots();
    dots($('camDots'), frameIdx);
    await fontsReady; drawFrame(octx, frameIdx, new Date());
    clearInterval(clockT); let lastMin = new Date().getMinutes();
    clockT = setInterval(() => { const n = new Date(); if (n.getMinutes() !== lastMin && current === 'camera') { lastMin = n.getMinutes(); drawFrame(octx, frameIdx, n); } }, 5000);
    if (!hintShown) { hintShown = true; $('hint').classList.remove('hide'); setTimeout(hideHint, 3200); } else hideHint();
    flashPill($('camPill'));
    await startStream();
  }

  async function startStream() {
    stopStream();
    try {
      if (!navigator.mediaDevices?.getUserMedia) throw new Error('no camera api');
      stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } } });
      video.srcObject = stream; video.classList.toggle('mirror', facing === 'user');
      await video.play().catch(() => {});
    } catch (err) {
      console.warn(err);
      toast('Camera blocked — tap the button to use your phone camera instead', 4000);
      stream = null;
    }
  }
  function stopStream() { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } video.srcObject = null; }

  $('flipBtn').addEventListener('click', () => { facing = facing === 'user' ? 'environment' : 'user'; startStream(); });
  $('backBtn').addEventListener('click', () => { stopStream(); clearInterval(clockT); current = 'welcome'; show('welcome'); });

  // raw photo (no frame) kept so frames can still be swapped on the review screen
  const raw = document.createElement('canvas'); raw.width = W; raw.height = H; const rctx = raw.getContext('2d');
  let shotTime = new Date(), mirrorShot = false;

  function drawCover(src, sw, sh, mirror) {
    const scale = Math.max(W / sw, H / sh), dw = sw * scale, dh = sh * scale;
    rctx.save(); rctx.fillStyle = '#000'; rctx.fillRect(0, 0, W, H);
    if (mirror) { rctx.translate(W, 0); rctx.scale(-1, 1); }
    rctx.drawImage(src, (W - dw) / 2, (H - dh) / 2, dw, dh); rctx.restore();
  }

  $('shutter').addEventListener('click', () => {
    if (!stream || !video.videoWidth) { $('fileInput').click(); return; }
    drawCover(video, video.videoWidth, video.videoHeight, facing === 'user');
    shotTime = new Date();
    const f = $('flash'); f.classList.add('go'); requestAnimationFrame(() => requestAnimationFrame(() => f.classList.remove('go')));
    setTimeout(goReview, 180);
  });

  $('fileInput').addEventListener('change', e => {
    const file = e.target.files[0]; e.target.value = ''; if (!file) return;
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { drawCover(img, img.naturalWidth, img.naturalHeight, false); URL.revokeObjectURL(url); shotTime = new Date(); goReview(); };
    img.onerror = () => toast("Couldn't open that photo — try again");
    img.src = url;
  });

  // ---------- review ----------
  const finalC = $('final'), fctx = finalC.getContext('2d');
  const ovl2 = document.createElement('canvas'); ovl2.width = W; ovl2.height = H; const o2 = ovl2.getContext('2d');
  let uploadId = null, sent = false, sending = false, blob = null;

  function compose() {
    fctx.drawImage(raw, 0, 0); drawFrame(o2, frameIdx, shotTime); fctx.drawImage(ovl2, 0, 0);
    sent = false; blob = null; uploadId = crypto.randomUUID ? crypto.randomUUID() : '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, ch => (ch ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> ch / 4).toString(16));
    finalC.toBlob(b => { blob = b; }, 'image/jpeg', .9);
    updateSendBtn();
  }

  function goReview() {
    stopStream(); clearInterval(clockT);
    current = 'review'; show('review'); placeDots();
    compose(); dots($('revDots'), frameIdx); $('revPill').classList.add('hide');
  }

  function updateSendBtn() {
    const b = $('sendBtn'); b.classList.toggle('done', sent);
    if (sent) { b.textContent = '✓ Sent — take another'; b.disabled = false; }
    else if (sending) { b.textContent = 'Sending…'; b.disabled = true; }
    else if (!canSave) { b.textContent = 'Take another'; b.disabled = false; }
    else { b.textContent = 'Send to Tyler & Julie ♥'; b.disabled = false; }
  }

  async function send() {
    if (sent || sending || !canSave) return sent;
    sending = true; updateSendBtn();
    try {
      const payload = { id: uploadId, photo: finalC.toDataURL('image/jpeg', .85), name: guestName, people: '', caption: '', note: '', frame: FRAMES[frameIdx].key, filter: 'original' };
      const tok = authToken();
      const res = await fetch(UPLOAD_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', ...(tok ? { Authorization: 'Bearer ' + tok } : {}) }, body: JSON.stringify(payload) });
      const out = await res.json().catch(() => ({}));
      if (!res.ok || !out.saved) throw new Error(out.error || 'Upload failed');
      sent = true; toast('Sent to Tyler & Julie 🖤');
    } catch (err) {
      console.warn(err); toast("Didn't send — check your signal and tap Send again", 3500);
    } finally { sending = false; updateSendBtn(); }
    return sent;
  }

  $('sendBtn').addEventListener('click', () => {
    if (sent || !canSave) { current = 'camera'; openCamera(); return; }
    send();
  });

  $('retakeBtn').addEventListener('click', () => { openCamera(); });

  $('downloadBtn').addEventListener('click', async () => {
    const getBlob = blob ? Promise.resolve(blob) : new Promise(r => finalC.toBlob(r, 'image/jpeg', .9));
    const b = await getBlob;
    const fname = `tyler-julie-${shotTime.toISOString().slice(0, 19).replace(/[:T]/g, '-')}.jpg`;
    const file = new File([b], fname, { type: 'image/jpeg' });
    send(); // keeping a photo also sends it to the couple
    if (navigator.canShare && navigator.canShare({ files: [file] }) && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
      try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = fname;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  });

  document.addEventListener('visibilitychange', () => { if (document.hidden) stopStream(); else if (current === 'camera') startStream(); });
})();
</script>
</body>
</html>
