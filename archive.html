<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private archive · Tyler & Julie</title>
<style>body{margin:0;background:#110d10;color:#f2e6d8;font:16px Georgia,serif}main{max-width:1100px;margin:auto;padding:36px 20px}h1{font-weight:400;font-size:48px}a{color:#ead1bb}button,input{font:inherit;padding:13px;border-radius:12px;border:1px solid #a98b7a}button{cursor:pointer;background:#702035;color:white}input{background:#f9f1e8;color:#20141b;display:block;box-sizing:border-box;width:100%;margin:12px 0}form{max-width:420px}#photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px}article{background:#f3e6d8;color:#251820;padding:16px;border-radius:16px}img{width:100%;border-radius:8px}article a{color:#702035}article button{margin:5px}p{line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}label{display:block}#status{min-height:25px}[hidden]{display:none!important}</style>
<main><a href="/">← Back to the photo booth</a><h1>Our found photographs</h1><p>A private collection of the people we love.</p>
<form id="login"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Open our archive</button></form>
<p id="status" role="status" aria-live="polite"></p><section id="collection" hidden><div class="toolbar"><button id="refresh">Refresh</button><button id="showHidden">Show hidden photos</button><button id="logout">Sign out</button><a href="/">Test the booth</a></div><div id="photos"></div><button id="more" hidden>Load more</button></section></main>
<script>
let config,token=sessionStorage.getItem('archive_token'),photos=[],hidden=false,offset=0;const $=id=>document.getElementById(id),status=t=>$('status').textContent=t;
async function request(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...options.headers}});const b=await r.json();if(!r.ok){if(r.status===401)logout();throw new Error(b.error||'Request failed. Please try again.')}return b;}
function logout(){token=null;sessionStorage.removeItem('archive_token');photos=[];$('photos').replaceChildren();$('login').hidden=false;$('collection').hidden=true;}
async function load(append=false){try{status('Opening your memories…');const result=await request('/api/archive?offset='+(append?offset:0));photos=append?photos.concat(result.photos):result.photos;offset=photos.length;$('more').hidden=result.photos.length<50;$('login').hidden=true;$('collection').hidden=false;render();status(photos.length+' photos loaded.');}catch(e){status(e.message);}}
function render(){$('photos').replaceChildren();for(const p of photos.filter(p=>hidden||!p.hidden)){const card=document.createElement('article'),img=document.createElement('img'),title=document.createElement('h2'),copy=document.createElement('p'),link=document.createElement('a');img.src=p.url;img.alt='Keepsake from '+p.guest_name;img.loading='lazy';title.textContent=p.guest_name;copy.textContent=[p.other_names,p.caption,p.note,new Date(p.created_at).toLocaleString()].filter(Boolean).join('\n');link.href=p.url;link.textContent='Download photograph';link.addEventListener('click',async e=>{e.preventDefault();try{const r=await fetch(p.url);if(!r.ok)throw Error();const u=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=u;a.download='found-photo-'+p.id+'.jpg';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch{status('Download failed. Refresh the archive and retry.')}});card.append(img,title,copy,link);for(const field of ['favorite','hidden']){const b=document.createElement('button');b.textContent=field==='favorite'?(p.favorite?'♥ Favorited':'♡ Favorite'):(p.hidden?'Restore':'Hide');b.onclick=async()=>{b.disabled=true;try{await request('/api/archive',{method:'PATCH',body:JSON.stringify({id:p.id,field,value:!p[field]})});p[field]=!p[field];render()}catch(e){status(e.message);b.disabled=false}};card.append(b)}$('photos').append(card)}}
$('login').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{config ||= await fetch('/api/config').then(r=>r.json());const r=await fetch(config.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:config.key,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});const auth=await r.json();if(!r.ok)throw Error('Sign-in failed. Check your email and password.');token=auth.access_token;sessionStorage.setItem('archive_token',token);$('password').value='';await load()}catch(e){status(e.message)}finally{b.disabled=false}};
$('logout').onclick=()=>{logout();status('Signed out on this tab.');};$('refresh').onclick=()=>load();$('more').onclick=()=>load(true);$('showHidden').onclick=()=>{hidden=!hidden;$('showHidden').textContent=hidden?'Hide hidden photos':'Show hidden photos';render()};if(token)load();
</script></html>
